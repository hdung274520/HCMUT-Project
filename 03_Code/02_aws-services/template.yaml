AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Minimal sensors backend - Sessions, SpotMeasurements and nightly DailyVitals behind an API key

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 256

Resources:
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: timestamp_start, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: timestamp_start, KeyType: RANGE }

  SpotMeasurementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: timestamp, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: timestamp, KeyType: RANGE }

  DailyVitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: date, KeyType: RANGE }

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }   # no self sign-up
      UsernameAttributes: [email]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "hcmut-vitals-${AWS::AccountId}"   # prefix must be globally unique

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false   # public browser client, uses PKCE
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: &urls
        - https://hdung274520.github.io/HCMUT-Project/03_Code/04_web-app/
        - http://localhost:5500/
      LogoutURLs: *urls

  SensorApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        ApiKeyRequired: true
        AddApiKeyRequiredToCorsPreflight: false   # browser preflight has no key
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
        UsagePlan:
          CreateUsagePlan: PER_API
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,x-api-key,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:   # 401/403 from the authorizer need CORS too, or the browser hides the status
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  SessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sessions.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref SensorApi, Path: /sessions, Method: post }
        Get:
          Type: Api
          Properties: { RestApiId: !Ref SensorApi, Path: /sessions, Method: get, Auth: { Authorizer: CognitoAuth, ApiKeyRequired: false } }

  MeasurementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: measurements.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref SpotMeasurementsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpotMeasurementsTable
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref SensorApi, Path: /measurements, Method: post }
        Get:
          Type: Api
          Properties: { RestApiId: !Ref SensorApi, Path: /measurements, Method: get, Auth: { Authorizer: CognitoAuth, ApiKeyRequired: false } }

  DailyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: daily.handler
      Timeout: 60
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          SPOT_TABLE: !Ref SpotMeasurementsTable
          DAILY_TABLE: !Ref DailyVitalsTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref SpotMeasurementsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DailyVitalsTable }
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 0 * * ? *)   # 00:05, folds yesterday
            ScheduleExpressionTimezone: Asia/Ho_Chi_Minh
        Get:
          Type: Api
          Properties: { RestApiId: !Ref SensorApi, Path: /vitals/daily, Method: get, Auth: { Authorizer: CognitoAuth, ApiKeyRequired: false } }
        Latest:
          Type: Api
          Properties: { RestApiId: !Ref SensorApi, Path: /vitals/latest, Method: get, Auth: { Authorizer: CognitoAuth, ApiKeyRequired: false } }

Outputs:
  ApiUrl:
    Value: !Sub "https://${SensorApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  ApiKeyId:
    Value: !Ref SensorApiApiKey   # key SAM creates for the usage plan
  UserPoolClientId:
    Value: !Ref WebClient
  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
