AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HCMUT-Project: Medical Signal Audio Assistant Cloud Backend
  Provides Serverless HTTP API, DynamoDB Tables, and S3 Data Lake for real-time vitals and EEG monitoring.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment target environment.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        STAGE: !Ref Environment
        VITALS_TABLE: !Ref VitalsTable
        SESSIONS_TABLE: !Ref SessionsTable
        USERS_TABLE: !Ref UserProfilesTable
        RAW_BUCKET: !Ref RawSignalDataBucket

Resources:
  # =========================================================================
  # HTTP API Gateway with CORS
  # =========================================================================
  MedicalHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Api-Key"
          - "X-Amz-Date"
          - "X-Amz-Security-Token"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  # =========================================================================
  # Lambda Functions
  # =========================================================================
  IngestVitalsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.ingest_vitals.lambda_handler
      Description: Ingest physiological vital signs and detect anomalies.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VitalsTable
      Events:
        PostVitals:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalHttpApi
            Path: /vitals
            Method: POST

  QueryVitalsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.query_vitals.lambda_handler
      Description: Query vital signs history and latest metrics for dashboards.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VitalsTable
      Events:
        GetLatestVitals:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalHttpApi
            Path: /vitals/latest
            Method: GET
        GetVitalsHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalHttpApi
            Path: /vitals/history
            Method: GET

  SessionManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.session_handler.lambda_handler
      Description: Manage Sleep and Meditation EEG sessions.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        PostSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalHttpApi
            Path: /sessions
            Method: POST
        ListSessions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalHttpApi
            Path: /sessions
            Method: GET
        GetSingleSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref MedicalHttpApi
            Path: /sessions/{sessionId}
            Method: GET

  # =========================================================================
  # DynamoDB Storage (On-Demand / Pay-Per-Request for Free Tier efficiency)
  # =========================================================================
  VitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "HCMUT-VitalsTable-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "HCMUT-SessionsTable-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: session_id
          KeyType: RANGE

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "HCMUT-UserProfilesTable-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  # =========================================================================
  # S3 Bucket for Raw Biosignals & Data Lake
  # =========================================================================
  RawSignalDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "hcmut-medical-raw-signals-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  HttpApiUrl:
    Description: URL of the HTTP API Gateway endpoint
    Value: !Sub "https://${MedicalHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  VitalsTableName:
    Description: Name of the DynamoDB Vitals table
    Value: !Ref VitalsTable
  SessionsTableName:
    Description: Name of the DynamoDB Sessions table
    Value: !Ref SessionsTable
  RawSignalBucketName:
    Description: S3 Bucket storing raw physiological data
    Value: !Ref RawSignalDataBucket
