# =====================================================================
# CẤU HÌNH RÀNG BUỘC THIẾT BỊ & HỆ THỐNG (DEVICE & SYSTEM CONSTRAINTS)
# =====================================================================
# Thông tin cấu hình thực tế của hệ thống người dùng để tối ưu hóa hiệu năng.

# 1. Hệ điều hành & Môi trường chạy Agent (Host OS & Environment)
environment:
  os: "linux"               # OS chạy chính (Core Host OS): Raspberry Pi OS (Linux)
  distro: "Raspberry Pi OS (Debian Bookworm)"
  python_version: "3.11"    
  node_version: "22"        

# 2. Cấu hình phần cứng (Hardware Configuration)
# Chứa cấu hình máy phát triển PC (Ubuntu Linux) và thiết bị chạy chính Raspberry Pi 4
hardware:
  development_pc:
    os: "linux"
    distro: "Ubuntu 26.04 LTS"
    cpu: "Intel Core i5-1135G7"
    ram_gb: 16
    gpu:
      has_nvidia_gpu: false   # Không có GPU NVIDIA (Sử dụng Intel Iris Xe hoặc CPU)
      gpu_model: "Intel Iris Xe Graphics"
      vram_gb: 0
  target_edge:
    device_name: "Raspberry Pi 4 Model B"
    ram_gb: 4                 # RAM giới hạn 4GB (Cần tối ưu hóa mô hình AI siêu nhẹ)
    cpu: "Broadcom BCM2711, Quad-core Cortex-A72"
    gpu: "Broadcom VideoCore VI (None-CUDA)"

# 3. Trí tuệ Nhân tạo (Artificial Intelligence Engine)
# Các mô hình STT, TTS và Agent core chạy hoàn toàn offline bằng cách tự động chọn cấu hình phù hợp với thiết bị.
ai_engine:
  llm_brand: "Ollama (Offline)"
  llm_model: "qwen2.5:3b (PC) / qwen2.5:0.5b (Raspberry Pi 4)"
  stt_model: "faster-whisper-base (PC) / faster-whisper-tiny (Raspberry Pi 4)"
  tts_model: "piper-tts (ONNX)"

# 4. Thiết bị đo tín hiệu sinh học (Medical/Biological Sensors)
# Cấu hình thiết bị đo EEG/PPG (Muse 2), ECG (Magene H303), SpO2 (Yuwell YX110) cho Hợp nhất cảm biến (Sensor Fusion)
devices:
  eeg:
    brand: "Muse 2"           # Thiết bị đo chính
    connection_type: "bluetooth" # Kết nối Bluetooth BLE (thông qua thư viện BrainFlow)
    channels_count: 4         # Muse 2 có 4 kênh điện cực chính: TP9, AF7, AF8, TP10
    sample_rate_hz: 256       # Tần số lấy mẫu mặc định của Muse 2 là 256 Hz
  vitals:
    blood_pressure: "Simulator"
    heart_rate:
      primary_source: "Magene H303"             # Đai ngực đo ECG - nguồn nhịp tim/HRV chính xác nhất (ưu tiên 1)
      secondary_source: "Muse 2 PPG (Vùng chẩm/trán chẩm)" # Dùng khi không đeo H303 trong phiên đo EEG (ưu tiên 2)
      spot_source: "Yuwell YX110"               # Mạch đo kèm SpO2 theo từng lần (ưu tiên 3)
      continuous_24_7: false                    # Không có thiết bị đeo nền 24/7 - chỉ có dữ liệu khi đeo/đo
    spo2:
      source: "Yuwell YX110"                    # Máy kẹp ngón đo SpO2 theo từng lần (tự tắt sau ~8 giây, không đo qua đêm)
  heart_rate_strap:
    brand: "Magene H303"
    connection_type: "bluetooth"                # BLE 4.2 (chuẩn Heart Rate Service 0x180D) + ANT+
    measurement: "ECG"                          # Lấy nhịp tim trực tiếp từ sóng ECG, ít nhiễu khi vận động
    hr_range_bpm: [30, 240]
    rr_intervals: "cần kiểm tra"                # Xác nhận characteristic 0x2A37 có gửi RR-interval (để tính HRV) bằng nRF Connect
    battery_hours: 1000                         # Pin CR2032 - đeo qua đêm được
  pulse_oximeter:
    brand: "Yuwell YX110"
    connection_type: "bluetooth"
    protocol: "cần kiểm tra"                    # Chuẩn Pulse Oximeter Service (0x1822) hay giao thức riêng của hãng
    measurement_mode: "spot"                    # Đo theo từng lần, cho kết quả sau 5-8 giây
  edge_gateway:
    all_devices_connect_to: "Raspberry Pi 4"    # Muse 2, H303, YX110 đều kết nối BLE về Pi (Pi là cổng dữ liệu duy nhất lên AWS)
    note: "Nếu BLE tích hợp của Pi 4 không ổn định khi giữ Muse 2 + H303 cùng lúc, dùng thêm USB Bluetooth 5.0 dongle"

# 5. Cấu hình tần số nhiễu điện lưới (Power Grid Noise Frequency)
power_grid:
  mains_frequency_hz: 50    # Tần số 50 Hz (phổ biến tại Việt Nam và Châu Âu)

# 6. Dữ liệu Người dùng (User Metadata)
# Dùng để tự động tính BMI, BMR, ngưỡng nhịp tim tối đa và hiệu chỉnh baseline sóng não EEG thích ứng
user_metadata:
  age: 25                   # Tuổi người dùng (dùng để tính nhịp tim tối đa an toàn: 220 - tuổi)
  gender: "male"            # Giới tính (male / female - dùng để hiệu chỉnh baseline huyết áp/HRV và BMR)
  height_cm: 175            # Chiều cao tính bằng cm (dùng để tính BMI)
  weight_kg: 70             # Cân nặng tính bằng kg (dùng để tính BMI & BMR)
  calibration_sessions: 3   # Số phiên đo đầu tiên để ghi nhận Baseline sóng não cá nhân hóa

# 7. Cấu hình dịch vụ Cloud & Phân quyền (Cloud Settings)
cloud:
  aws_profile: "default"    
  aws_region: "ap-southeast-1" 


