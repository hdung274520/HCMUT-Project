name: CI - Test & Validate Schemas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Code & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pydantic flake8 boto3

      - name: Validate JSON Schemas
        run: |
          python 04_Code/validate_schemas.py

      - name: Run Lambda Unit Tests
        run: |
          python 04_Code/02_aws-services/test_handlers.py

      - name: Lint Python Code (Syntax & Critical Errors)
        run: |
          # Dừng build nếu có lỗi cú pháp Python hoặc biến chưa khai báo
          flake8 04_Code/02_aws-services --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 04_Code/02_aws-services --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Validate SAM Template Syntax
        run: |
          pip install cfn-lint
          cfn-lint 04_Code/02_aws-services/template.yaml || echo "Warning: cfn-lint check completed"

