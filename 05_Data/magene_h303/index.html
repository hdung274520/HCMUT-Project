<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H303 dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  #status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
  #status.connected { background: #1b4332; color: #74c69d; }
  #status.disconnected { background: #4a1b1b; color: #e07a7a; }
  .vitals { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .vital { background: #1c1c1c; border-radius: 12px; padding: 16px 24px; min-width: 160px; }
  .vital .label { color: #888; font-size: 13px; }
  .vital .value { font-size: 56px; font-weight: 600; }
  .vital .unit { color: #888; font-size: 16px; margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; }
  th { color: #888; font-weight: normal; }
  td.hex { font-family: ui-monospace, monospace; color: #9ecbff; }
  #count { color: #888; font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>Magene H303</h1>
  <div class="sub">Live heart rate and RR intervals over BLE (Heart Rate Service 0x180D).</div>
  <div id="status" class="disconnected">disconnected</div>
  <div class="vitals">
    <div class="vital"><div class="label">Heart rate</div><div><span id="hr" class="value">--</span><span class="unit">bpm</span></div></div>
    <div class="vital"><div class="label">RR interval</div><div><span id="rr" class="value">--</span><span class="unit">ms</span></div></div>
    <div class="vital"><div class="label">Sensor contact</div><div><span id="contact" class="value">--</span></div></div>
  </div>
  <div id="count">0 packets</div>
  <table>
    <thead><tr><th>Time</th><th>HR</th><th>RR (ms)</th><th>Raw hex</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  const statusEl = document.getElementById("status");
  const rowsEl = document.getElementById("rows");
  const countEl = document.getElementById("count");
  let count = 0;

  function connect() {
    const ws = new WebSocket("ws://localhost:8766");
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "status") {
        statusEl.textContent = msg.message;
        statusEl.className = msg.connected ? "connected" : "disconnected";
      } else if (msg.type === "packet") {
        const r = msg.reading;
        document.getElementById("hr").textContent = r.pulse_bpm ?? "--";
        if (r.rr_ms.length) document.getElementById("rr").textContent = r.rr_ms[r.rr_ms.length - 1];
        document.getElementById("contact").textContent =
          r.sensor_contact === null ? "n/a" : (r.sensor_contact ? "yes" : "no");

        count += 1;
        countEl.textContent = `${count} packets`;
        const tr = document.createElement("tr");
        const time = new Date(msg.timestamp).toLocaleTimeString();
        tr.innerHTML = `<td>${time}</td><td>${r.pulse_bpm ?? "--"}</td><td>${r.rr_ms.join(", ")}</td><td class="hex">${msg.raw_hex}</td>`;
        rowsEl.prepend(tr);
        while (rowsEl.children.length > 200) rowsEl.removeChild(rowsEl.lastChild);
      }
    };
    ws.onclose = () => {
      statusEl.textContent = "dashboard server not reachable, retrying...";
      statusEl.className = "disconnected";
      setTimeout(connect, 2000);
    };
  }

  connect();
</script>
</body>
</html>
